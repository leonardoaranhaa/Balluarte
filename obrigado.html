<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recebido — BALUARTE</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<link rel="icon" href="/favicon/favicon.ico" sizes="any">
<link rel="icon" href="/favicon/favicon-dark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
<meta name="theme-color" content="#0E1113">
<style>
:root {
  --paper: #E6E6E6;
  --ink: #0E1113;
  --mist: #5A6063;
  --graphite: #0E1113;
  --amber-deep: #7E5200;
  --r: 4px;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  display: grid; align-content: center;
  background: var(--paper); color: var(--ink);
  font-family: var(--sans); font-size: 1.0625rem; line-height: 1.6;
  padding: clamp(1.5rem, 6vw, 4rem);
  -webkit-font-smoothing: antialiased;
}
.wrap { width: 100%; max-width: 34rem; margin-inline: auto; }
.mark { display: inline-flex; text-decoration: none; margin-bottom: 2.5rem; }
.mark img { display: block; width: 210px; height: auto; }
h1 {
  font-size: clamp(1.5rem, 1.2rem + 1.4vw, 2rem);
  font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; margin: 0;
}
p { margin: 1.25rem 0 0; }
.note { color: var(--mist); font-size: 0.9375rem; }
a { color: var(--amber-deep); text-underline-offset: 3px; }
.back {
  display: inline-block; margin-top: 2.5rem;
  background: var(--graphite); color: var(--paper);
  padding: 0.7rem 1.15rem; border-radius: var(--r);
  text-decoration: none; font-weight: 500;
}
:focus-visible { outline: 2px solid var(--amber-deep); outline-offset: 3px; border-radius: 2px; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="mark" href="/" aria-label="BALUARTE — início">
      <img src="/assets/marca/svg/baluarte-logo-horizontal-light-simples.svg"
           alt="" width="1169" height="428">
    </a>

    <h1>Recebido.</h1>

    <p>
      Respondo em até um dia útil, com dois ou três horários. Se você descreveu um
      caso, vou olhar antes da call — assim os 20 minutos começam no seu problema e
      não na apresentação.
    </p>

    <p class="note">
      Se preferir adiantar qualquer coisa, escreva para
      <a href="mailto:contato@baluarte.com.br">contato@baluarte.com.br</a>.
    </p>

    <a class="back" href="/">Voltar</a>
  </div>
</body>
</html>
